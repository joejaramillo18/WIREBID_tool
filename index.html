<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Wirebid Estimator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E9EDF1; --surface:#FFFFFF; --surface2:#F4F6F8; --surface3:#E8ECF0;
  --ink:#131920; --ink2:#4B5663; --ink3:#7A8693; --line:#D3DAE1; --line2:#E3E8ED;
  --cu:#B45F1A; --cu-ink:#FFFFFF; --cu-soft:#F7E7D8; --cu-line:#E4B892;
  --ok:#1C7F47; --ok-soft:#DDF2E5; --warn:#A96C0E; --warn-soft:#FBEFD6; --bad:#B8332A; --bad-soft:#F9E0DD;
  --info:#2A63A3; --info-soft:#DEE9F6;
  --rail:#131A21; --rail-ink:#9AA7B4; --rail-active:#FFFFFF;
  --shadow:0 1px 2px rgba(16,24,32,.06),0 4px 16px rgba(16,24,32,.06);
  --r:10px; --r-sm:7px;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1217; --surface:#151C23; --surface2:#1A222B; --surface3:#212B35;
    --ink:#E7ECF1; --ink2:#9AA8B6; --ink3:#6C7A88; --line:#27323D; --line2:#1F2831;
    --cu:#E38C3F; --cu-ink:#1A0F05; --cu-soft:#35230F; --cu-line:#6A4420;
    --ok:#46BE78; --ok-soft:#15301F; --warn:#E2AB44; --warn-soft:#352812; --bad:#EC6A5B; --bad-soft:#3A1916;
    --info:#6FA6E4; --info-soft:#162A42;
    --rail:#090D11; --rail-ink:#7F8D9B; --rail-active:#FFFFFF;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1217; --surface:#151C23; --surface2:#1A222B; --surface3:#212B35;
  --ink:#E7ECF1; --ink2:#9AA8B6; --ink3:#6C7A88; --line:#27323D; --line2:#1F2831;
  --cu:#E38C3F; --cu-ink:#1A0F05; --cu-soft:#35230F; --cu-line:#6A4420;
  --ok:#46BE78; --ok-soft:#15301F; --warn:#E2AB44; --warn-soft:#352812; --bad:#EC6A5B; --bad-soft:#3A1916;
  --info:#6FA6E4; --info-soft:#162A42;
  --rail:#090D11; --rail-ink:#7F8D9B; --rail-active:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--cu);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* shell */
.app{display:grid;grid-template-columns:84px 1fr;min-height:100%}
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:14px 8px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{display:grid;place-items:center;margin-bottom:14px}
.brand .mark{width:40px;height:40px;border-radius:9px;background:linear-gradient(145deg,#E9974D,#9E4F12);display:grid;place-items:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.brand .mark svg{width:24px;height:24px}
.nav{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:9px;border:0;background:none;color:var(--rail-ink);cursor:pointer;font:600 11px/1.1 var(--f-body);letter-spacing:.02em}
.nav svg{width:22px;height:22px}
.nav:hover{color:#D5DEE7;background:rgba(255,255,255,.05)}
.nav.on{color:var(--rail-active);background:rgba(227,140,63,.16)}
.nav.on svg{color:#E9974D}
.rail .grow{flex:1}
.save-dot{font:500 10px/1.2 var(--f-body);color:var(--rail-ink);text-align:center;padding:6px 2px}
.save-dot i{display:block;width:8px;height:8px;border-radius:50%;margin:0 auto 4px;background:#46BE78}
.save-dot.pending i{background:#E2AB44}
.save-dot.local i{background:#6FA6E4}

.main{min-width:0;display:flex;flex-direction:column}
.page{padding-inline:28px;padding-block:22px 120px;max-width:1320px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.ptitle{font:700 34px/1.02 var(--f-display);letter-spacing:.005em;margin-top:6px}
.psub{color:var(--ink2);margin-top:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--ink3)}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--cu);border-color:var(--cu);color:var(--cu-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--surface3);color:var(--ink)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:7px;border:0;background:transparent;color:var(--ink3);cursor:pointer}
.icon-btn:hover{background:var(--surface3);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
.icon-btn.star.on{color:var(--cu)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.card-h h3{font:700 19px/1.1 var(--f-display);letter-spacing:.01em}
.card-b{padding:16px 18px}
.muted{color:var(--ink2)}
.faint{color:var(--ink3)}
.small{font-size:12.5px}

/* forms */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 16px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label,.lbl{font:600 11.5px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.inp,select.inp,textarea.inp{height:40px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface2);width:100%;min-width:0}
textarea.inp{height:auto;min-height:90px;padding:9px 11px;resize:vertical;line-height:1.45}
.inp:focus{border-color:var(--cu);background:var(--surface);outline:none;box-shadow:0 0 0 3px var(--cu-soft)}
.inp.num{text-align:right}
.inp.sm{height:32px;padding:0 8px}
.inp-suffix{position:relative}
.inp-suffix .inp{padding-right:30px}
.inp-suffix span{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:12.5px;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:13px;color:var(--ink2)}
.chip:hover{border-color:var(--ink3);color:var(--ink)}
.chip.on{background:var(--cu-soft);border-color:var(--cu-line);color:var(--ink)}
.chip .ct{font:500 11px/1 var(--f-mono);background:var(--surface3);color:var(--ink2);padding:3px 6px;border-radius:99px}
.chip.on .ct{background:var(--cu);color:var(--cu-ink)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:none;padding:0 11px;height:32px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--surface)}
select.cond{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);padding:0 6px;font-size:12.5px;max-width:132px}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:99px;font:600 11px/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.draft{background:var(--surface3);color:var(--ink2)}
.pill.submitted{background:var(--info-soft);color:var(--info)}
.pill.won{background:var(--ok-soft);color:var(--ok)}
.pill.lost{background:var(--bad-soft);color:var(--bad)}
.pill.sample{background:var(--cu-soft);color:var(--cu)}
.tag{display:inline-block;font:600 10.5px/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:4px 6px;border-radius:5px;background:var(--surface3);color:var(--ink2)}
.tag.stale{background:var(--warn-soft);color:var(--warn)}
.tag.zero{background:var(--bad-soft);color:var(--bad)}
.tag.cu{background:var(--cu-soft);color:var(--cu)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font:600 11px/1.2 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface2)}
.tbl td.num,.tbl th.r{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl .nm{font-weight:600}
.tbl .sub{font-size:12px;color:var(--ink3);margin-top:1px}
.tbl tr.comp td{background:var(--surface2);font-size:13px;padding-top:6px;padding-bottom:6px}
.tbl tr.comp td:first-child{padding-left:34px}
.tbl input.q{width:84px;height:32px;text-align:right;font-family:var(--f-mono);border:1px solid var(--line);border-radius:6px;background:var(--surface2);padding:0 8px}
.tbl input.q:focus{border-color:var(--cu);outline:none;background:var(--surface)}
.tbl input.q.edited,.tbl input.edited{border-color:var(--cu-line);background:var(--cu-soft)}
.empty{padding:36px 18px;text-align:center;color:var(--ink2)}
.empty b{display:block;font:700 20px/1.2 var(--f-display);color:var(--ink);margin-bottom:4px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .k{font:600 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.kpi .v{font:700 30px/1.1 var(--f-display);margin-top:8px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--ink2);margin-top:2px}

/* stepper */
.steps{display:flex;gap:2px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:5px;scrollbar-width:thin}
.step{flex:1 0 auto;display:flex;align-items:center;gap:8px;border:0;background:none;padding:8px 12px;border-radius:7px;cursor:pointer;color:var(--ink2);font-weight:600;font-size:13px;white-space:nowrap}
.step b{font:600 11px/1 var(--f-mono);width:21px;height:21px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--ink3)}
.step:hover{background:var(--surface2);color:var(--ink)}
.step.on{background:var(--ink);color:var(--surface)}
.step.on b{border-color:var(--cu);background:var(--cu);color:var(--cu-ink)}
.step.done b{border-color:var(--ok);color:var(--ok)}
.step .wdot{width:7px;height:7px;border-radius:50%;background:var(--warn)}

/* estimate header */
.est-head{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.est-head .meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--ink2);font-size:13px;margin-top:6px}
.lockbar{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:var(--r);background:var(--info-soft);color:var(--ink);border:1px solid var(--line)}
.lockbar svg{width:18px;height:18px;color:var(--info);flex:none}

/* meter */
.meter{position:fixed;left:84px;right:0;bottom:0;z-index:20;background:var(--rail);color:#E7ECF1;padding:10px 24px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:stretch;border-top:1px solid rgba(255,255,255,.06);overflow-x:auto}
.meter .m{padding:4px 16px;border-right:1px solid rgba(255,255,255,.08);min-width:max-content}
.meter .m:last-child{border-right:0}
.meter .mk{font:600 10px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:#7F8D9B}
.meter .mv{font:600 20px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:5px;white-space:nowrap}
.meter .mv small{font-size:12px;color:#9AA7B4;font-weight:500}
.meter .m.price .mv{color:#F0A866;font-size:24px;margin-top:2px}
.meter .gm{display:inline-flex;align-items:center;gap:6px}
.meter .gm i{width:9px;height:9px;border-radius:50%}
.meter .spacer{flex:1;border:0}

/* takeoff */
.to-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.secnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px}
.secbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:500;text-align:left}
.secbtn:hover{background:var(--surface);color:var(--ink)}
.secbtn.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--cu)}
.secbtn .ct{font:500 11.5px/1 var(--f-mono);color:var(--ink3)}
.secbtn .hrs{font:500 11px/1 var(--f-mono);color:var(--ink3)}
.search-box{position:relative}
.search-box svg.s{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--ink3);pointer-events:none}
.search-box input{height:50px;width:100%;padding:0 16px 0 44px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.search-box input:focus{border-color:var(--cu);outline:none;box-shadow:0 0 0 4px var(--cu-soft)}
.search-box .hint{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink3)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.18);max-height:430px;overflow:auto;padding:6px}
.rgroup{font:600 10.5px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:10px 10px 6px}
.ritem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;cursor:pointer}
.ritem.act,.ritem:hover{background:var(--cu-soft)}
.ritem .t{flex:1;min-width:0}
.ritem .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .t span{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ritem .p{font:500 12px/1.3 var(--f-mono);color:var(--ink2);text-align:right;white-space:nowrap}
.kind{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--surface3);color:var(--ink2)}
.kind svg{width:16px;height:16px}
.kind.a{background:var(--cu);color:var(--cu-ink)}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.qbtn{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--ink2);font-size:13px;font-weight:500}
.qbtn:hover{border-style:solid;border-color:var(--cu-line);color:var(--ink);background:var(--cu-soft)}
.qbtn svg{width:14px;height:14px}
.caret{transition:transform .15s}
.caret.open{transform:rotate(90deg)}

/* factors */
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.fitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface2)}
.fitem.on{border-color:var(--cu-line);background:var(--cu-soft)}
.fitem .fl{flex:1;min-width:0;font-weight:500}
.fitem .fl small{display:block;font-size:11.5px;color:var(--ink3);font-weight:400}
.fitem input.fv{width:66px;height:32px;text-align:right;font-family:var(--f-mono);border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 6px}
.toggle{position:relative;width:38px;height:22px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.toggle span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.15s;pointer-events:none}
.toggle span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle input:checked+span{background:var(--cu)}
.toggle input:checked+span::after{transform:translateX(16px)}
.eqn{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:15px;padding:14px 18px;background:var(--surface2);border-radius:9px;border:1px solid var(--line2)}
.eqn .big{font:600 26px/1 var(--f-mono);color:var(--ink)}
.eqn .op{color:var(--ink3)}
.eqn .lab{font:600 10px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:5px}

/* two col */
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.cols-prop{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
.cols-asm{grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr)}
.cols>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}

/* waterfall / breakdown */
.ledger{display:flex;flex-direction:column}
.lrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line2)}
.lrow:last-child{border-bottom:0}
.lrow .lk{color:var(--ink2)}
.lrow .lv{min-width:0;overflow-wrap:anywhere;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.lrow.tot{border-bottom:0;border-top:1.5px solid var(--ink);margin-top:4px;padding-top:10px}
.lrow.tot .lk{color:var(--ink);font-weight:700}
.lrow.tot .lv{font-weight:700;font-size:16px}
.lrow.price{background:var(--cu-soft);border-radius:8px;padding:12px;margin-top:8px;border:0}
.lrow.price .lk{font:700 18px/1 var(--f-display);color:var(--ink);letter-spacing:.02em}
.lrow.price .lv{font:700 24px/1 var(--f-mono);color:var(--cu)}
.bar{display:flex;height:14px;border-radius:5px;overflow:hidden;background:var(--surface3);gap:2px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}

/* warnings */
.warn-list{display:flex;flex-direction:column;gap:8px}
.w{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:9px;border:1px solid var(--line2)}
.w svg{width:18px;height:18px;flex:none;margin-top:1px}
.w.bad{background:var(--bad-soft)} .w.bad svg{color:var(--bad)}
.w.warn{background:var(--warn-soft)} .w.warn svg{color:var(--warn)}
.w.info{background:var(--info-soft)} .w.info svg{color:var(--info)}
.w.ok{background:var(--ok-soft)} .w.ok svg{color:var(--ok)}
.w b{display:block;font-weight:600}
.w span{font-size:13px;color:var(--ink2)}
.w .go{margin-left:auto;flex:none}

/* proposal preview */
.paper{background:#FFFFFF;color:#1B1F24;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.08),0 18px 50px rgba(0,0,0,.14);padding:44px 48px;max-width:780px;margin:0 auto;font-size:13px;line-height:1.5}
.paper h4{font:700 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:#9A5316;margin:22px 0 8px}
.paper .ph{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #1B1F24;padding-bottom:16px}
.paper .co{font:700 26px/1 var(--f-display);letter-spacing:.01em}
.paper .doc{text-align:right;font:700 28px/1 var(--f-display);letter-spacing:.06em;color:#9A5316}
.paper .doc small{display:block;font:500 12px/1.5 var(--f-body);letter-spacing:0;color:#555;margin-top:4px}
.paper .two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px}
.paper .k{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.08em}
.paper ul{margin:0;padding-left:18px}
.paper .pricebox{margin-top:24px;display:flex;justify-content:space-between;align-items:center;background:#1B1F24;color:#fff;padding:16px 20px;border-radius:4px}
.paper .pricebox b{font:700 28px/1 var(--f-mono)}
.paper .sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:34px}
.paper .sig div{border-top:1px solid #333;padding-top:6px;font-size:11px;color:#666}
.paper pre{white-space:pre-wrap;font:inherit;margin:0}

/* drawer / modal */
.scrim{position:fixed;inset:0;background:rgba(8,12,16,.55);z-index:60;display:flex;justify-content:flex-end}
.scrim.center{justify-content:center;align-items:flex-start;padding:6vh 16px}
.drawer{width:min(620px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.25)}
.modal{width:min(920px,100%);max-height:88vh;background:var(--surface);border-radius:12px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.sm{width:min(560px,100%)}
.dh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h3{font:700 22px/1.1 var(--f-display);flex:1}
.db{padding:18px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;font-weight:600;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.confirm{padding:14px;border-radius:9px;background:var(--bad-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* misc */
.split{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.stat{padding:12px 14px;border:1px solid var(--line2);border-radius:9px;background:var(--surface2)}
.stat .k{font:600 10.5px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.stat .v{font:600 20px/1.2 var(--f-mono);margin-top:6px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--ink3)}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;color:var(--ink2);cursor:pointer;background:var(--surface2)}
.dropzone:hover,.dropzone.over{border-color:var(--cu);background:var(--cu-soft)}
.dropzone b{display:block;font:700 20px/1.2 var(--f-display);color:var(--ink);margin-bottom:4px}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 16px}

.cls-new{color:var(--ok)} .cls-price{color:var(--info)} .cls-match{color:var(--ink3)} .cls-dup{color:var(--warn)} .cls-conflict{color:var(--bad)}
.more{display:flex;justify-content:center;padding:12px}
.risk-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.risk-row:last-child{border-bottom:0}
.risk-row .rl b{font-weight:600;display:block}
.risk-row .rl span{font-size:12px;color:var(--ink3)}
.seg.risk button.on.inc{background:var(--ok);color:#fff}
.seg.risk button.on.exc{background:var(--bad);color:#fff}
.seg.risk button.on.na{background:var(--ink3);color:#fff}
.logo-prev{padding:16px;border:1px dashed var(--line);border-radius:10px;background:repeating-conic-gradient(var(--surface2) 0 25%,var(--surface) 0 50%) 0 0/16px 16px;display:flex;justify-content:center}
.logo-prev img{max-height:90px;max-width:100%}
.paper .plogo{display:block;max-height:56px;max-width:220px;margin-bottom:10px}
.var{font:600 12px/1 var(--f-mono);padding:4px 7px;border-radius:5px;white-space:nowrap}
.var.bad{background:var(--bad-soft);color:var(--bad)} .var.ok{background:var(--ok-soft);color:var(--ok)} .var.flat{background:var(--surface3);color:var(--ink2)}
.tbl tr.tot td{font-weight:700;border-top:1.5px solid var(--ink)}
select.co-st.approved{border-color:var(--ok);color:var(--ok);font-weight:600} select.co-st.rejected{color:var(--bad)} select.co-st.submitted{color:var(--info)}
.gmbar{position:relative;height:16px;min-width:120px}
.gmbar .trk{position:absolute;left:0;right:0;top:7px;height:2px;background:var(--line);border-radius:2px}
.gmbar .seg{position:absolute;top:6px;height:4px;border-radius:2px}
.gmbar .seg.down{background:var(--bad)} .gmbar .seg.up{background:var(--ok)}
.gmbar .dot{position:absolute;top:3px;width:10px;height:10px;margin-left:-5px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
.gmbar .dot.est{background:var(--ink3)} .gmbar .dot.act.down{background:var(--bad)} .gmbar .dot.act.up{background:var(--ok)}
.addr-hist{display:flex;gap:8px;align-items:center;padding:10px 14px;border-radius:9px;background:var(--cu-soft);border:1px solid var(--cu-line);font-size:13px}

  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}

  .meter .spacer{display:none}
  .search-box .hint{display:none}
  .est-head .row .btn{flex:1}
  .page{padding-inline:16px;padding-block:16px 190px}
  .ptitle{font-size:28px}
  .paper{padding:24px 20px}

  .paper .pricebox{flex-direction:column;align-items:flex-start;gap:6px}
  .kpi .v{font-size:24px}
  .tbl input.q{width:66px}
}

  const st=S.settings, num=nextEstNum(S);
  return {
    id:uid("e"), num, rev:0, status:"draft", created:today(), updated:Date.now(),
    job:{customer:"",project:"",address:"",types:["Commercial"],estimator:st.estimator||"",date:today(),due:"",start:"",duration:"",notes:"",contact:"",phone:"",email:""},
    defaultCol:1, lines:[],
    factors:FACTORS.map(f=>({k:f[0],v:f[2],on:false})),
    crew:[{cls:"Journeyman",count:1},{cls:"Apprentice",count:1}],
    rates:clone(st.rates), pw:{on:false,mult:1.35},
    np:{mob:st.small.mob,purchasing:st.small.purchasing,setup:st.small.setup,cleanup:st.small.cleanup,admin:st.small.admin,travel:st.small.travel,on:false},
    expenses:[], risk:{},
    mk:{overhead:st.defaults.overhead,contingency:st.defaults.contingency,profit:st.defaults.profit,tax:st.defaults.tax,waste:st.defaults.waste,applyMin:false,roundTo:st.roundTo},
    prop:{scope:"",inclusions:st.inclusions,exclusions:st.exclusions,allowances:"",alternates:"",schedule:"",terms:st.terms,coLang:st.coLang,expiresDays:st.expiresDays},
    snapshot:null, awardedAt:null, lostAt:null
  };
}
function nextEstNum(S){
  const y=new Date().getFullYear().toString().slice(2);
  let max=0; for(const e of S.estimates.values()){ const m=/^(\d{2})-(\d{3,})/.exec(e.num||""); if(m&&m[1]===y) max=Math.max(max,+m[2]); }
  return `${y}-${String(max+1).padStart(3,"0")}`;
}

/* ---------- material helpers ---------- */
function matLabel(m){ return m.name; }
function monthsOld(date){ if(!date) return 999; const d=new Date(date+"T12:00:00"); return (Date.now()-d.getTime())/(1000*3600*24*30.44); }
function isStale(date,S){ return monthsOld(date) > (S.settings.staleMonths||12); }

/* A line snapshot of a material — price and labor are frozen here */
function snapMat(m,q){ return {ref:m.id,name:m.name,cat:m.cat,unit:m.unit,q:q,cost:m.cost,date:m.date,lab:m.lab.slice()}; }

function makeItemLine(m,sec,qty){
  return {id:uid("l"),kind:"item",sec,ref:m.id,name:m.name,cat:m.cat,unit:m.unit,qty:qty||1,col:null,
    cost:m.cost,date:m.date,lab:m.lab.slice(),projOnly:!!m.projOnly,oCost:null,oHrs:null,note:""};
}
function makeAsmLine(a,S,sec,qty){
  const comps=[]; for(const [id,q,run] of a.comps){ const m=S.mats.get(id); if(m){ const k=snapMat(m,q); if(run) k.run=1; comps.push(k); } }
  return {id:uid("l"),kind:"asm",sec:sec||a.sec,ref:a.id,name:a.name,unit:a.unit||"ea",qty:qty||1,runs:1,col:null,comps,oCost:null,oHrs:null,note:"",extraHrs:a.extraHrs||0};
}
function makeDemoLine(sec){
  return {id:uid("l"),kind:"demo",sec:sec||"Demo",name:"Remove existing",dtype:"Removal",unit:"ea",qty:1,hrs:0.25,disp:0,note:""};
}

/* ---------- CALC ENGINE (pure) ---------- */
function lineCol(line,est){ return line.col==null?est.defaultCol:line.col; }
function lineUnit(line,est){
  const c=lineCol(line,est);
  if(line.kind==="item") return {mat:line.oCost!=null?line.oCost:line.cost, hrs:line.oHrs!=null?line.oHrs:(line.lab[c]||0)};
  if(line.kind==="asm"){
    let mat=0,hrs=0,fixMat=0,fixHrs=0; for(const k of line.comps){ if(k.run){ fixMat+=k.q*k.cost; fixHrs+=k.q*(k.lab[c]||0); } else { mat+=k.q*k.cost; hrs+=k.q*(k.lab[c]||0); } }
    hrs+=n(line.extraHrs);
    return {mat:line.oCost!=null?line.oCost:mat, hrs:line.oHrs!=null?line.oHrs:hrs, calcMat:mat, calcHrs:hrs, fixMat, fixHrs};
  }
  if(line.kind==="demo") return {mat:n(line.disp),hrs:n(line.hrs)};
  return {mat:0,hrs:0};
}
function lineRuns(line){ return line.runs==null?1:n(line.runs); }
function lineExt(line,est){ const u=lineUnit(line,est), q=n(line.qty), r=line.kind==="asm"?lineRuns(line):0; return {mat:u.mat*q+(u.fixMat||0)*r,hrs:u.hrs*q+(u.fixHrs||0)*r,u}; }

function blendedRate(est){
  let heads=0,sum=0,wage=0;
  for(const c of est.crew){ const r=est.rates[c.cls]; if(!r||!(c.count>0)) continue; heads+=n(c.count); sum+=n(c.count)*n(r.wage)*(1+n(r.burden)/100); wage+=n(c.count)*n(r.wage); }
  const loaded=heads?sum/heads:0, mult=est.pw&&est.pw.on?n(est.pw.mult)||1:1;
  return {heads, loaded:loaded*mult, wage:heads?wage/heads*mult:0};
}
function factorProduct(est){ let f=1; for(const x of est.factors) if(x.on) f*=n(x.v)||1; return f; }
function npHours(est){ const p=est.np; if(!p||!p.on) return 0; return n(p.mob)+n(p.purchasing)+n(p.setup)+n(p.cleanup)+n(p.admin)+n(p.travel); }

function calc(est,S){
  const secs={}; let mat=0,baseHrs=0,demoHrs=0;
  for(const l of est.lines){
    const e=lineExt(l,est); mat+=e.mat; baseHrs+=e.hrs; if(l.kind==="demo"||l.sec==="Demo") demoHrs+=e.hrs;
    const s=secs[l.sec]||(secs[l.sec]={mat:0,hrs:0,count:0}); s.mat+=e.mat; s.hrs+=e.hrs; s.count++;
  }
  const waste=mat*n(est.mk.waste)/100, tax=(mat+waste)*n(est.mk.tax)/100, matTotal=mat+waste+tax;
  const F=factorProduct(est), adjHrs=baseHrs*F, np=npHours(est), totalHrs=adjHrs+np;
  const br=blendedRate(est), labor=totalHrs*br.loaded;
  let equip=0,subs=0,direct=0; const expByCat={};
  for(const x of est.expenses){ const a=n(x.amt); expByCat[x.cat]=(expByCat[x.cat]||0)+a; if(EQUIP_CATS.includes(x.cat)) equip+=a; else if(SUB_CATS.includes(x.cat)) subs+=a; else direct+=a; }
  const cost=matTotal+labor+equip+subs+direct;
  const overhead=cost*n(est.mk.overhead)/100, contingency=cost*n(est.mk.contingency)/100;
  const profit=(cost+overhead+contingency)*n(est.mk.profit)/100;
  let raw=cost+overhead+contingency+profit;
  const rt=n(est.mk.roundTo); let price=rt>0?Math.ceil(raw/rt)*rt:raw;
  const minJob=n(S.settings.minJob), belowMin=price<minJob&&price>0;
  let minAdj=0; if(belowMin&&est.mk.applyMin){ minAdj=minJob-price; price=minJob; }
  const roundAdj=price-raw-minAdj;
  const gp=price-cost, gm=price>0?gp/price:0, markup=cost>0?gp/cost:0, net=price>0?(profit+roundAdj+minAdj)/price:0;
  const days=br.heads?totalHrs/(br.heads*(S.settings.hoursPerDay||8)):0;
  return {mat,waste,tax,matTotal,baseHrs,demoHrs,F,adjHrs,np,totalHrs,rate:br.loaded,heads:br.heads,labor,equip,subs,direct,expByCat,
    cost,overhead,contingency,profit,raw,price,roundAdj,minAdj,belowMin,minJob,gp,gm,markup,net,days,crewHrs:br.heads?totalHrs/br.heads:0,secs};
}
/* back-solve profit % to hit a target gross margin */
function profitForGM(est,S,gmPct){
  const c=calc(est,S), target=gmPct/100; if(target>=1) return null;
  const price=c.cost/(1-target), base=c.cost+c.overhead+c.contingency;
  return base>0?Math.max(0,(price-base)/base*100):0;
}

/* ---------- warnings ---------- */
function warnings(est,S,c){
  const W=[], L=est.lines;
  if(!L.length){ W.push(["info","Takeoff is empty","Add assemblies or items to start pricing.","takeoff"]); return W; }
  let stale=0,oldest=null,zero=[];
  const LABOR_ONLY=/install|demo|drill|trench|bend|term|rental|bore|custom/i;
  const chk=(date,cost,name,lab)=>{ if(isStale(date,S)){stale++; if(!oldest||date<oldest) oldest=date;} if(!(cost>0)&&lab&&lab.some(x=>x>0)&&!LABOR_ONLY.test(name)) zero.push(name); };
  for(const l of L){ if(l.kind==="item"&&l.oCost==null) chk(l.date,l.cost,l.name,l.lab); if(l.kind==="asm"&&l.oCost==null) for(const k of l.comps) if(k.q>0) chk(k.date,k.cost,k.name,k.lab); }
  if(stale) W.push(["warn",`${stale} material price${stale>1?"s are":" is"} older than ${S.settings.staleMonths} months`,`Oldest price date ${oldest||"unknown"}. Refresh from the supplier before submitting.`,"takeoff"]);
  if(zero.length){ const u=[...new Set(zero)]; W.push(["bad",`${u.length} item${u.length>1?"s have":" has"} $0 material cost`,`${u.slice(0,4).join(", ")}${u.length>4?"…":""}. Owner-furnished, or a missing price?`,"takeoff"]); }
  if(c.gm*100 < S.settings.targetGM-0.05) W.push(["bad",`Gross margin ${pct(c.gm)} is below your ${S.settings.targetGM}% target`,`Raise profit, or use "Hit target" on the Markup step.`,"markup"]);
  if(!est.expenses.some(x=>x.cat==="Permits"&&n(x.amt)>0)) W.push(["warn","No permit allowance","Add a permit fee under Expenses, or exclude permits on the proposal.","expenses"]);
  if(!(n(est.mk.contingency)>0)) W.push(["warn","No contingency","Zero contingency on a job with any unknowns is a bet.","markup"]);
  const hasDemoLines=L.some(l=>l.sec==="Demo");
  if(L.some(l=>l.sec==="Demo"&&lineExt(l,est).hrs<=0)) W.push(["bad","Demo line with no labor","Every demo line needs hours; demo doesn't borrow install units.","takeoff"]);
  const t=est.job.types||[];
  if((t.includes("Remodel")||t.includes("Demolition")||t.includes("Tenant Improvement"))&&!hasDemoLines) W.push(["info","Remodel / TI with no demo","Most remodels have removals, make-safe, or circuit tracing.","takeoff"]);
  if(c.belowMin) W.push(["warn",`Price is below your ${money(c.minJob)} minimum`,est.mk.applyMin?"Minimum is applied.":"Turn on the minimum charge or add small-job hours.","markup"]);
  const spec=L.some(l=>l.sec==="Specialty Systems"||l.cat==="Fire Alarm"||l.sec==="Controls");
  const testing=L.some(l=>l.sec==="Testing")||est.expenses.some(x=>(x.cat==="Testing"||x.cat==="Commissioning")&&n(x.amt)>0);
  if(spec&&!testing) W.push(["warn","Specialty or controls scope with no testing allowance","Add testing / commissioning hours or an expense.","expenses"]);
  if(c.F>1.5) W.push(["warn",`Stacked labor factor is ${c.F.toFixed(2)}×`,"Factors multiply. Check you're not double-counting the same difficulty.","conditions"]);
  if(est.defaultCol>=3&&est.factors.some(f=>f.on&&(f.k==="finished"||f.k==="unknown"))) W.push(["info","Remodel column plus remodel-type factors","The Remodel/Old Work labor column already carries some of this difficulty.","conditions"]);
  const share=c.cost>0?c.labor/c.cost:0;
  if(c.cost>0&&(share<0.2||share>0.8)) W.push(["info",`Labor is ${pct(share)} of job cost`,share<0.2?"Unusually low. Check labor units and crew rates.":"Unusually high. Check quantities and factors.","labor"]);
  if(!c.heads) W.push(["bad","No crew assigned","Labor cost is $0 until a crew is set.","labor"]);
  const unk=RISK_ITEMS.filter(r=>!est.risk[r[0]]).length;
  if(unk) W.push(["info",`${unk} scope-risk items not reviewed`,"Mark each as included, excluded, or N/A.","risk"]);
  if(!est.job.customer||!est.job.project) W.push(["info","Job info incomplete","Customer and project name print on the proposal.","job"]);
  return W;
}

/* ---------- formatting ---------- */
function money(v,dec){ const d=dec==null?0:dec; return (v<0?"-":"")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function money2(v){ return money(v,2); }
function hrs(v){ return (Math.round(v*10)/10).toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1}); }
function pct(v,d){ return (v*100).toFixed(d==null?1:d)+"%"; }
function qfmt(v){ return (+v).toLocaleString("en-US",{maximumFractionDigits:3}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function gmTone(gm,S){ const t=S.settings.targetGM/100; return gm>=t?"ok":gm>=t-0.05?"warn":"bad"; }

/* ---------- scope text generated from takeoff ---------- */
function autoScope(est){
  const by={};
  for(const l of est.lines){ (by[l.sec]=by[l.sec]||[]).push(l); }
  const out=[];
  for(const s of SECTIONS){ const ls=by[s]; if(!ls) continue;
    const parts=ls.map(l=>{ const q=n(l.qty); const nm=l.kind==="demo"?`${l.dtype.toLowerCase()}: ${l.name}`:l.name; return l.unit==="ft"?`${qfmt(q)} ft ${nm}`:`(${qfmt(q)}) ${nm}`; });
    out.push(`${s}: ${parts.join("; ")}`);
  }
  return out.join("\n");
}

/* ---------- purchasing list (assemblies expanded) ---------- */
function purchasingList(est){
  const m=new Map();
  const add=(ref,name,cat,unit,q,cost)=>{ const k=ref||name; const r=m.get(k)||{ref,name,cat,unit,qty:0,cost}; r.qty+=q; m.set(k,r); };
  for(const l of est.lines){
    const q=n(l.qty);
    if(l.kind==="item"&&l.cost>=0) add(l.ref,l.name,l.cat,l.unit,q,l.oCost!=null?l.oCost:l.cost);
    if(l.kind==="asm") for(const k of l.comps) if(k.q>0) add(k.ref,k.name,k.cat,k.unit,k.run?k.q*lineRuns(l):k.q*q,k.cost);
  }
  return [...m.values()].filter(r=>r.qty>0).sort((a,b)=>(a.cat||"").localeCompare(b.cat||"")||a.name.localeCompare(b.name));
}

/* ---------------- persistence ---------------- */
const LS_KEY="wirebid:v1";
const pending=new Map(); let flushT=null, saving=false;
function lsGet(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsPut(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(exportAll())); }catch(e){} }
function exportAll(){
  const mats={}; for(const m of S.mats.values()) if(m.custom||m.dirty) mats[m.id]=stripMat(m);
  const asms={}; for(const a of S.asms.values()) if(!a.builtin||a.dirty) asms[a.id]=stripAsm(a);
  const ests={}; for(const e of S.estimates.values()) if(!e.sample||e.touched) ests[e.id]=e;
  return {v:1,settings:S.settings,materials:mats,assemblies:asms,estimates:ests,profiles:S.profiles};
}
function stripMat(m){ const o=Object.assign({},m); delete o.dirty; return o; }
function stripAsm(a){ return {id:a.id,name:a.name,sec:a.sec,grp:a.grp||"",unit:a.unit||"ea",fav:!!a.fav,note:a.note||"",comps:a.comps,extraHrs:a.extraHrs||0,builtin:!!a.builtin,deleted:!!a.deleted}; }
function save(kind,id){
  if(kind==="est"){ const e=S.estimates.get(id); if(e){ e.updated=Date.now(); if(e.sample) e.touched=true; } }
  pending.set(kind+":"+(id||""),{kind,id}); setSaveDot();
  clearTimeout(flushT); flushT=setTimeout(flush,700);
}
async function flush(){
  if(saving){ clearTimeout(flushT); flushT=setTimeout(flush,400); return; }
  const jobs=[...pending.values()]; pending.clear(); if(!jobs.length) return;
  saving=true;
  try{
    if(S.db){
      for(const j of jobs){
        try{
          if(j.kind==="settings") await S.db.doc("config/settings").set(S.settings);
          else if(j.kind==="profiles") await S.db.doc("config/importProfiles").set({profiles:S.profiles});
          else if(j.kind==="mat"){ const m=S.mats.get(j.id); if(m) await S.db.doc("materials/"+safeId(j.id)).set(stripMat(m)); }
          else if(j.kind==="asm"){ const a=S.asms.get(j.id); if(a) await S.db.doc("assemblies/"+safeId(j.id)).set(stripAsm(a)); }
          else if(j.kind==="est"){ const e=S.estimates.get(j.id); const ref=S.db.doc("estimates/"+safeId(j.id)); if(e) await ref.set(e); else await ref.delete(); }
        }catch(err){ console.warn("save failed",j,err); if(err&&err.code==="quota_exceeded") toast("Storage is full. Delete old estimates or custom items."); }
      }
    }
    lsPut();
  } finally { saving=false; setSaveDot(); }
}
function safeId(id){ return String(id).replace(/[^A-Za-z0-9_\-.~:@+]/g,"_"); }
function setSaveDot(){
  const el=document.getElementById("savedot"); if(!el) return;
  const p=pending.size>0||saving;
  el.className="save-dot"+(p?" pending":S.mode==="local"?" local":"");
  el.innerHTML=`<i></i>${p?"Saving":S.mode==="db"?"Saved":"On this device"}`;
}

async function load(){
  for(const r of RAW_CATALOG){ const m=catalogToMat(r); S.base.set(m.id,m); S.mats.set(m.id,clone(m)); }
  let data=null;
  try{
    const db=window.claude&&window.claude.use?await Promise.race([window.claude.use("db"),new Promise(r=>setTimeout(()=>r(null),10000))]):null;
    if(db){
      S.db=db; S.mode="db";
      const [st,pr,ms,as,es]=await Promise.all([db.doc("config/settings").get(),db.doc("config/importProfiles").get(),db.collection("materials").get(),db.collection("assemblies").get(),db.collection("estimates").get()]);
      data={settings:st.exists?st.data():null,profiles:pr.exists?(pr.data().profiles||{}):{},materials:{},assemblies:{},estimates:{}};
      ms.docs.forEach(d=>{const v=d.data(); data.materials[v.id]=v;});
      as.docs.forEach(d=>{const v=d.data(); data.assemblies[v.id]=v;});
      es.docs.forEach(d=>{const v=d.data(); data.estimates[v.id]=v;});
      const empty=!data.settings&&!ms.size&&!as.size&&!es.size;
      if(empty){ const loc=lsGet(); if(loc) data=loc; }
    }
  }catch(e){ console.warn("db unavailable",e); S.db=null; }
  if(!S.db){ S.mode="local"; data=lsGet(); }
  if(data){
    if(data.settings) S.settings=Object.assign(defaultSettings(),clone(data.settings));
    S.profiles=data.profiles||{};
    for(const m of Object.values(data.materials||{})) S.mats.set(m.id,Object.assign(catalogToMat(["","","","","ea",0,"",[0,0,0,0,0],"EA","EA"]),clone(m),{dirty:!m.custom}));
    for(const e of Object.values(data.estimates||{})) S.estimates.set(e.id,clone(e));
  }
  const byName=new Map(); for(const m of S.base.values()) byName.set(m.name,m.id);
  for(const a of BUILTIN_ASM) S.asms.set(a.id,{id:a.id,name:a.name,sec:a.sec,grp:a.grp||"",unit:a.unit||"ea",fav:!!a.fav,note:a.note||"",extraHrs:0,builtin:true,comps:a.c.map(([nm,q,run])=>[byName.get(nm),q,run?1:0]).filter(x=>x[0])});
  if(data) for(const a of Object.values(data.assemblies||{})) S.asms.set(a.id,Object.assign(clone(a),{dirty:!!a.builtin}));
  if(!S.estimates.size) makeSample();
}
function makeSample(){

/* ---- step: takeoff ---- */
function stepTakeoff(e,c){
  const sec=S.ui.sec, lines=e.lines.filter(l=>sec==="All"||l.sec===sec);
  const secBtns=["All",...SECTIONS].map(s=>{ const x=s==="All"?{count:e.lines.length,hrs:c.baseHrs}:(c.secs[s]||{count:0,hrs:0});

    :`<div class="quick">${sec==="Demo"?`<button class="qbtn" data-a="addDemo">${ic("demo")}Add demo line</button>`:`<span class="small faint">Star assemblies to pin them here.</span>`}</div>`;
  const rows=lines.map(l=>lineRow(l,e)).join("");

          <span class="hint">qty first · Enter to add</span>
          <div id="results"></div>
        </div>

      </div></div>

function lineRow(l,e){

  let html=`<tr data-line="${l.id}">

    <td><div class="nm">${esc(l.name)}</div><div class="sub">${S.ui.sec==="All"?esc(l.sec)+" · ":""}${esc(l.unit)} ${tags}</div></td>

    <td class="r"><input class="q" type="number" min="0" step="any" inputmode="decimal" value="${l.qty}" data-i="qty" data-id="${l.id}" aria-label="Quantity"></td>

  if(open){
    if(l.kind==="asm"){
      html+=l.comps.map((k,i)=>`<tr class="comp"><td></td><td>${esc(k.name)} ${k.run?'<span class="tag cu">Per run</span>':""}${isStale(k.date,S)?`<span class="tag stale">${esc(k.date||"undated")}</span>`:""}${!(k.cost>0)?'<span class="tag zero">$0</span>':""}</td><td class="small faint">${esc(k.unit)}</td>
        <td class="r"><input class="q" type="number" min="0" step="any" value="${k.q}" data-i="compq" data-id="${l.id}" data-k="${i}" aria-label="Qty per assembly"></td>
        <td class="num r">${money2(k.cost)}</td><td class="num r">${(k.lab[col]||0).toFixed(3)}</td><td class="num r faint">${money(k.q*k.cost*(k.run?lineRuns(l):n(l.qty)))}</td><td class="num r faint">${(k.q*(k.lab[col]||0)*(k.run?lineRuns(l):n(l.qty))).toFixed(2)}</td><td></td></tr>`).join("");
    }
    html+=`<tr class="comp"><td></td><td colspan="8"><div class="row" style="gap:14px;padding:6px 0">
      ${l.kind==="demo"?`<div class="fld" style="min-width:200px;flex:1"><label>Description</label><input class="inp sm" value="${esc(l.name)}" data-i="lineField" data-id="${l.id}" data-f="name"></div>

        <div class="fld" style="width:110px"><label>Hrs / unit</label><input class="inp sm num" type="number" step="any" value="${l.hrs}" data-i="lineField" data-id="${l.id}" data-f="hrs" data-t="n"></div>

      :`<div class="fld" style="width:140px"><label>Mat $/unit override</label><input class="inp sm num${l.oCost!=null?" edited":""}" type="number" step="any" placeholder="${money2(l.kind==="asm"?x.u.calcMat:l.cost)}" value="${l.oCost==null?"":l.oCost}" data-i="override" data-id="${l.id}" data-f="oCost"></div>
        <div class="fld" style="width:140px"><label>Hrs/unit override</label><input class="inp sm num${l.oHrs!=null?" edited":""}" type="number" step="any" placeholder="${(l.kind==="asm"?x.u.calcHrs:(l.lab[col]||0)).toFixed(3)}" value="${l.oHrs==null?"":l.oHrs}" data-i="override" data-id="${l.id}" data-f="oHrs"></div>
        ${hasRun?`<div class="fld" style="width:110px"><label>Runs</label><input class="inp sm num" type="number" step="1" min="0" value="${lineRuns(l)}" data-i="lineField" data-id="${l.id}" data-f="runs" data-t="n"></div>`:""}
        ${l.kind==="asm"?`<div class="fld" style="width:120px"><label>Extra hrs / unit</label><input class="inp sm num" type="number" step="any" value="${l.extraHrs||0}" data-i="lineField" data-id="${l.id}" data-f="extraHrs" data-t="n"></div>`:""}`}

      ${l.kind!=="demo"?`<button class="btn sm" data-a="refreshLine" data-id="${l.id}" title="Pull current prices from the Material Master">${ic("refresh")}Refresh prices</button>`:""}
    </div></td></tr>`;

}
function patchLine(l,e){
  const tr=document.querySelector(`tr[data-line="${l.id}"]`); if(!tr) return; const x=lineExt(l,e);
  const set=(k,v)=>{ const td=tr.querySelector(`[data-cell="${k}"]`); if(td) td.textContent=v; };
  set("umat",money2(x.u.mat)); set("uhrs",x.u.hrs.toFixed(3)); set("mat",money(x.mat)); set("hrs",hrs(x.hrs));
}

/* search results for takeoff */
function parseQuick(q){ let m=/^\s*(\d+(?:\.\d+)?)\s*[x×*]?\s+(.*)$/i.exec(q); if(m) return {qty:+m[1],q:m[2]}; m=/^(.*?)\s*[x×*]\s*(\d+(?:\.\d+)?)\s*$/i.exec(q); if(m) return {qty:+m[2],q:m[1]}; return {qty:null,q}; }
function scoreText(hay,terms){ let s=0; for(const t of terms){ const i=hay.indexOf(t); if(i<0) return -1; s+=i===0?3:(hay[i-1]===" "?2:1); } return s; }
function searchAll(q,sec){
  const {qty,q:qq}=parseQuick(q); const terms=qq.toLowerCase().split(/\s+/).filter(Boolean); if(!terms.length) return {qty,asms:[],mats:[]};
  const asms=[...S.asms.values()].filter(a=>!a.deleted).map(a=>({a,s:scoreText((a.name+" "+a.sec+" "+(a.note||"")).toLowerCase(),terms)+(a.fav?2:0)+(a.sec===sec?1:0)})).filter(x=>x.s>=0).sort((x,y)=>y.s-x.s).slice(0,6).map(x=>x.a);
  const recent=S.settings.recent||[];
  const mats=[...S.mats.values()].filter(m=>m.active!==false).map(m=>({m,s:scoreText((m.name+" "+m.cat+" "+(m.desc||"")+" "+(m.mpn||"")+" "+(m.sku||"")).toLowerCase(),terms)+(recent.includes(m.id)?2:0)})).filter(x=>x.s>=0).sort((x,y)=>y.s-x.s).slice(0,12).map(x=>x.m);
  return {qty,asms,mats};
}
function renderResults(){
  const box=document.getElementById("results"); if(!box) return; const e=E();
  if(!S.ui.q.trim()){ box.innerHTML=""; return; }
  const r=searchAll(S.ui.q,S.ui.sec); S.ui._res=[...r.asms.map(a=>({t:"a",a})),...r.mats.map(m=>({t:"m",m}))];
  if(S.ui.act>=S.ui._res.length) S.ui.act=0;
  const col=e?e.defaultCol:1; let i=-1;
  const itm=x=>{ i++; if(x.t==="a"){ const a=x.a; let mat=0,h=0; for(const [id,q,run] of a.comps){ if(run) continue; const m=S.mats.get(id); if(m){mat+=q*m.cost;h+=q*(m.lab[col]||0);} }
      return `<div class="ritem${i===S.ui.act?" act":""}" data-a="pick" data-k="${i}"><span class="kind a">${ic("layers")}</span><span class="t"><b>${esc(a.name)}</b><span>${esc(a.grp||a.sec)} · ${a.comps.length} parts${a.unit==="ft"?" · priced per foot":""}${a.note?" · "+esc(a.note):""}</span></span><span class="p">${money2(mat)}/${a.unit||"ea"}<br>${h.toFixed(2)} hr</span></div>`; }
    const m=x.m; return `<div class="ritem${i===S.ui.act?" act":""}" data-a="pick" data-k="${i}"><span class="kind">${ic("item")}</span><span class="t"><b>${esc(m.name)}</b><span>${esc(m.cat)}${m.desc?" · "+esc(m.desc):""}</span></span><span class="p">${money2(m.cost)}/${m.unit}<br>${(m.lab[col]||0).toFixed(3)} hr</span></div>`; };
  const head=r.qty?`<div class="rgroup" style="color:var(--cu)">Adding quantity ${qfmt(r.qty)}</div>`:"";
  box.innerHTML=S.ui._res.length?`<div class="results">${head}${r.asms.length?`<div class="rgroup">Assemblies</div>${r.asms.map(a=>itm({t:"a",a})).join("")}`:""}${r.mats.length?`<div class="rgroup">Materials</div>${r.mats.map(m=>itm({t:"m",m})).join("")}`:""}</div>`
    :`<div class="results"><div class="empty" style="padding:18px"><b>No match for “${esc(parseQuick(S.ui.q).q)}”</b><button class="btn sm pri" data-a="newMatModal" style="margin-top:8px">${ic("plus")}Add it as a new material</button></div></div>`;
}
function pickResult(k){
  const e=E(); const x=S.ui._res&&S.ui._res[k]; if(!e||!x||locked(e)) return;
  const {qty}=parseQuick(S.ui.q); const q=qty||1; const sec=S.ui.sec==="All"?(x.t==="a"?x.a.sec:secForCat(x.m.cat)):S.ui.sec;
  let line; if(x.t==="a") line=makeAsmLine(x.a,S,sec,q); else { line=makeItemLine(x.m,sec,q); pushRecent(x.m.id); }
  e.lines.push(line); save("est",e.id); S.ui.q=""; S.ui.act=0;
  toast(`Added ${qfmt(q)} × ${line.name}${S.ui.sec==="All"?" to "+sec:""}`);
  render(); const inp=document.getElementById("tosearch"); if(inp) inp.focus();
  const tr=document.querySelector(`tr[data-line="${line.id}"]`); if(tr) tr.scrollIntoView({block:"nearest"});
}
function secForCat(cat){
  const m={"Lighting":"Lighting","Lighting Controls":"Controls","Wiring Devices":"Devices","Boxes":"Devices","Power Equipment":"Distribution","Excavation":"Underground","Stand-By Power":"Equipment","Fire Alarm":"Specialty Systems","Fans and Heaters":"Equipment","Wire":"Branch Circuits","Cable":"Branch Circuits"};
  return m[cat]||"Misc";
}
function pushRecent(id){ const r=S.settings.recent||(S.settings.recent=[]); const i=r.indexOf(id); if(i>=0) r.splice(i,1); r.unshift(id); r.length=Math.min(r.length,30); }

/* ---- step: conditions ---- */

  const p=e.np;
  const npf=(k,l)=>`<div class="fld"><label>${l}</label><div class="inp-suffix"><input class="inp num" type="number" step="0.25" min="0" value="${p[k]}" data-b="np.${k}" data-t="n"><span>hr</span></div></div>`;
  return `<div class="stack">
    <div class="card"><div class="card-h"><h3>Labor column</h3><span class="faint small">Base difficulty from your labor units</span></div><div class="card-b">${colSeg(e)}</div></div>

    </div></div>

      <p class="muted small" style="margin:0">Hours that aren't in any labor unit: getting there, buying parts, setup, cleanup, paperwork. Added after factors, not multiplied by them. Small jobs lose money here first.</p>
      <div class="fgrid">${npf("mob","Mobilization")}${npf("purchasing","Purchasing / pickup")}${npf("setup","Setup")}${npf("cleanup","Cleanup")}${npf("admin","Admin / paperwork")}${npf("travel","Travel")}</div>
      <div class="small muted">Truck charge and minimum job price live on the Markup step and in Settings.</div>
    </div></div></div>`;
}
function eqnHTML(c){

function stepLabor(e,c){
  const rows=e.crew.map((m,i)=>{ const r=e.rates[m.cls]||{wage:0,burden:0}; const loaded=n(r.wage)*(1+n(r.burden)/100);

      <td class="r"><input class="q" type="number" min="0" step="0.25" value="${r.wage}" data-i="rate" data-cls="${esc(m.cls)}" data-f="wage" aria-label="Wage"></td>
      <td class="r"><input class="q" type="number" min="0" step="1" value="${r.burden}" data-i="rate" data-cls="${esc(m.cls)}" data-f="burden" aria-label="Burden %"></td>

  return `<div class="cols"><div class="stack">
    <div class="card"><div class="card-h"><h3>Crew composition</h3><div class="spacer"></div><button class="btn sm" data-a="ownerOp">Owner-operator</button><button class="btn sm" data-a="addCrew">${ic("plus")}Add person</button></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Classification</th><th class="r">Count</th><th class="r">Wage $/hr</th><th class="r">Burden %</th><th class="r">Loaded $/hr</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="6" class="empty">No crew. Add at least one person.</td></tr>`}</tbody></table></div>
      <div class="card-b small muted">Rates are copied from Settings when the estimate is created, so changing Settings later won't move this bid.</div></div>

      <div class="card-b row"><div class="fld" style="width:140px"><label>Rate multiplier</label><input class="inp num" type="number" step="0.01" value="${e.pw.mult}" data-b="pw.mult" data-t="n"></div><p class="small muted" style="flex:1;margin:0">Prevailing wage changes cost per hour, not productivity, so it multiplies the loaded rate instead of the hours.</p></div></div>

function stepMarkup(e,c){
  const mk=e.mk, f=(k,l,suf,step)=>`<div class="fld"><label>${l}</label><div class="inp-suffix"><input class="inp num" type="number" step="${step||0.5}" min="0" value="${mk[k]}" data-b="mk.${k}" data-t="n"><span>${suf}</span></div></div>`;
  return `<div class="cols"><div class="stack">

      <div class="card"><div class="card-h"><h3>Assumptions</h3></div><div class="card-b ledger">

IC.chart='<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>';

/* ---------------- logo ---------------- */
async function readLogo(file){
  if(!/^image\//.test(file.type)){ toast("Pick an image file (PNG or JPG)."); return; }
  const url=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("That image couldn't be read")); i.src=url; });
  const scale=Math.min(1,600/img.width,240/img.height), w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h; const cx=cv.getContext("2d"); cx.drawImage(img,0,0,w,h);
  let out=cv.toDataURL("image/png");
  if(out.length>160000){ const c2=document.createElement("canvas"); c2.width=w; c2.height=h; const x2=c2.getContext("2d"); x2.fillStyle="#fff"; x2.fillRect(0,0,w,h); x2.drawImage(img,0,0,w,h); out=c2.toDataURL("image/jpeg",0.86); }
  S.settings.logo={src:out,w,h}; save("settings"); render(); toast("Logo added. It prints on proposals and bid sheets.");
}
function logoCard(){
  const L=S.settings.logo;
  return `<div class="card"><div class="card-h"><h3>Logo</h3><span class="faint small">Prints on proposals and bid sheets</span></div><div class="card-b stack">
    ${L?`<div class="logo-prev"><img src="${L.src}" alt="Company logo"></div>`:`<div class="small muted">No logo yet. PNG with a transparent background looks best. Wide logos work better than square.</div>`}
    <div class="row"><label class="btn">${ic("image")}${L?"Replace logo":"Upload logo"}<input type="file" accept="image/png,image/jpeg,image/webp" data-c="logo" style="display:none"></label>${L?`<button class="btn ghost danger" data-a="rmLogo">Remove</button>`:""}</div></div></div>`;
}

/* ---------------- job data ---------------- */
function ensureAct(e){ if(!e.act) e.act={mat:[],labor:[],other:[],cos:[],pct:0,closed:false,closedAt:null,notes:""}; return e.act; }
function loadedRate(e,cls){ const r=e.rates[cls]||S.settings.rates[cls]||{wage:0,burden:0}; return n(r.wage)*(1+n(r.burden)/100)*(e.pw&&e.pw.on?n(e.pw.mult)||1:1); }
function coCalc(co,c){ const cost=n(co.mat)+n(co.hrs)*c.rate+n(co.exp); const price=co.priceOverride!=null&&co.priceOverride!==""?n(co.priceOverride):cost*(1+n(co.markup)/100); return {cost,price}; }
function jobCalc(e){
  const c=calc(e,S), a=ensureAct(e);
  const appr=a.cos.filter(x=>x.status==="Approved");
  let coPrice=0,coCost=0,coMat=0,coHrs=0,coExp=0; for(const x of appr){ const k=coCalc(x,c); coPrice+=k.price; coCost+=k.cost; coMat+=n(x.mat); coHrs+=n(x.hrs); coExp+=n(x.exp); }
  const bud={mat:c.matTotal+coMat, hrs:c.totalHrs+coHrs, labor:c.labor+coHrs*c.rate, other:c.equip+c.subs+c.direct+coExp};
  bud.cost=bud.mat+bud.labor+bud.other;
  const act={mat:a.mat.reduce((s,x)=>s+n(x.amt),0), hrs:a.labor.reduce((s,x)=>s+n(x.hrs),0), labor:a.labor.reduce((s,x)=>s+n(x.hrs)*n(x.rate),0), other:a.other.reduce((s,x)=>s+n(x.amt),0)};
  act.cost=act.mat+act.labor+act.other;
  const contract=c.price+coPrice, pct=Math.min(1,Math.max(0,n(a.pct)/100));
  const secAct={}; for(const x of a.labor){ secAct[x.sec||"Misc"]=(secAct[x.sec||"Misc"]||0)+n(x.hrs); }
  const earned=bud.hrs*pct, prod=act.hrs>0?earned/act.hrs:null;
  const actGM=contract>0?(contract-act.cost)/contract:0;
  const estGM=e.snapshot?e.snapshot.gm:c.gm;
  return {c,a,bud,act,contract,orig:c.price,coPrice,coCost,appr,pct,earned,prod,secAct,actGM,estGM,closed:!!a.closed};
}
function varTag(actual,budget,lowerIsBetter){
  if(!(budget>0)) return '<span class="faint">—</span>';
  const v=actual/budget-1, bad=lowerIsBetter?v>0.02:v<-0.02, good=lowerIsBetter?v<-0.02:v>0.02;
  return `<span class="var ${bad?"bad":good?"ok":"flat"}">${v>0?"+":""}${(v*100).toFixed(1)}%${bad?" over":good?" under":""}</span>`;
}

/* ---------------- step: job costs ---------------- */
function stepJobCost(e){
  const j=jobCalc(e), a=j.a, L=a.closed;
  const clsOpts=cls=>Object.keys(e.rates).map(k=>opt(k,k,k===cls)).join("");
  const secOpts=s=>SECTIONS.map(x=>opt(x,x,x===s)).join("");
  const lab=a.labor.map((x,i)=>`<tr><td><input class="inp sm" type="date" value="${esc(x.date)}" data-ja="labor.${i}.date"></td><td><input class="inp sm" value="${esc(x.who||"")}" placeholder="Name" data-ja="labor.${i}.who"></td>
    <td><select class="inp sm" data-jc="labor.${i}.cls">${clsOpts(x.cls)}</select></td><td><select class="inp sm" data-jc="labor.${i}.sec">${secOpts(x.sec)}</select></td>
    <td class="r"><input class="q" type="number" step="0.25" min="0" value="${x.hrs}" data-ja="labor.${i}.hrs" data-t="n" aria-label="Hours"></td><td class="num r">${money2(n(x.rate))}</td><td class="r"><button class="icon-btn" data-a="jDel" data-k="labor.${i}">${ic("trash")}</button></td></tr>`).join("");
  const mat=a.mat.map((x,i)=>`<tr><td><input class="inp sm" type="date" value="${esc(x.date)}" data-ja="mat.${i}.date"></td><td><input class="inp sm" value="${esc(x.vendor||"")}" placeholder="Supplier" data-ja="mat.${i}.vendor"></td><td><input class="inp sm" value="${esc(x.ref||"")}" placeholder="Invoice / PO" data-ja="mat.${i}.ref"></td>

    <td><select class="inp sm co-st ${x.status.toLowerCase()}" data-jc="cos.${i}.status">${["Draft","Submitted","Approved","Rejected"].map(s=>opt(s,s,s===x.status)).join("")}</select></td>
    <td class="r"><button class="icon-btn" data-a="jDel" data-k="cos.${i}">${ic("trash")}</button></td></tr>`; }).join("");
  const body=`<div class="stack"><div class="kpis" id="cokpi">${coKpiHTML(j)}</div>
    <div class="card"><div class="card-h"><h3>Change orders</h3><span class="faint small">Priced with this job's crew rate: ${money2(c.rate)}/hr</span><div class="spacer"></div><button class="btn sm pri" data-a="coAdd">${ic("plus")}New change order</button></div>
      ${rows?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>Scope</th><th class="r">Material $</th><th class="r">Hours</th><th class="r">Other $</th><th class="r">Markup %</th><th class="r">Cost</th><th class="r">Price</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`

function coKpiHTML(j){ return `<div class="kpi"><div class="k">Original contract</div><div class="v">${money(j.orig)}</div><div class="s">As bid, never changes</div></div>
      <div class="kpi"><div class="k">Approved changes</div><div class="v">${money(j.coPrice)}</div><div class="s">${j.appr.length} approved of ${j.a.cos.length}</div></div>

      <div class="kpi"><div class="k">CO margin</div><div class="v">${j.coPrice>0?pct((j.coPrice-j.coCost)/j.coPrice):"—"}</div><div class="s">On approved changes</div></div>`; }
/* ---------------- step: closeout ---------------- */
function stepCloseout(e){
  const j=jobCalc(e), a=j.a, c=j.c;
  const gp=j.contract-j.act.cost;
  const rows=[["Material",j.bud.mat,j.act.mat,money],["Labor hours",j.bud.hrs,j.act.hrs,hrs],["Labor $",j.bud.labor,j.act.labor,money],["Equipment, subs, other",j.bud.other,j.act.other,money],["Total cost",j.bud.cost,j.act.cost,money]]
    .map(([k,b,v,f])=>`<tr${k==="Total cost"?' class="tot"':""}><td>${k}</td><td class="num r">${f(b)}</td><td class="num r">${f(v)}</td><td class="num r">${(v-b>0?"+":"")+f(v-b)}</td><td class="r">${varTag(v,b,true)}</td></tr>`).join("");
  const secs=SECTIONS.filter(s=>c.secs[s]||j.secAct[s]).map(s=>{ const b=(c.secs[s]?c.secs[s].hrs:0)*c.F, v=j.secAct[s]||0; return {s,b,v,d:b>0?v/b-1:null}; });
  const secRows=secs.map(x=>`<tr><td>${x.s}</td><td class="num r">${hrs(x.b)}</td><td class="num r">${hrs(x.v)}</td><td class="r">${varTag(x.v,x.b,true)}</td></tr>`).join("");
  const lessons=[];
  if(j.act.hrs>0&&j.bud.hrs>0){ const lv=j.act.hrs/j.bud.hrs-1; if(Math.abs(lv)>0.05) lessons.push(`Labor ran ${pct(Math.abs(lv))} ${lv>0?"over":"under"} the hours budget.`); }
  for(const x of secs) if(x.d!=null&&x.b>=4&&Math.abs(x.d)>0.15) lessons.push(`${x.s} ran ${pct(Math.abs(x.d),0)} ${x.d>0?"over":"under"} (${hrs(x.v)} vs ${hrs(x.b)} hrs). Check the labor units on the ${x.s.toLowerCase()} assemblies before the next similar bid.`);
  if(j.act.mat>0&&j.bud.mat>0){ const mv=j.act.mat/j.bud.mat-1; if(Math.abs(mv)>0.05) lessons.push(`Material ran ${pct(Math.abs(mv))} ${mv>0?"over":"under"}. ${mv>0?"Old prices or missed scope are the usual causes.":""}`); }
  if(j.appr.length&&j.coPrice>0&&(j.coPrice-j.coCost)/j.coPrice<j.estGM-0.05) lessons.push(`Change orders earned less margin than the base bid.`);
  const tone=j.actGM>=j.estGM-0.005?"ok":j.actGM>=j.estGM-0.05?"warn":"bad";
  return `<div class="stack">
    <div class="kpis">
      <div class="kpi"><div class="k">Revised contract</div><div class="v">${money(j.contract)}</div><div class="s">${money(j.orig)} bid + ${money(j.coPrice)} COs</div></div>
      <div class="kpi"><div class="k">Actual cost</div><div class="v">${money(j.act.cost)}</div><div class="s">vs ${money(j.bud.cost)} budget</div></div>
      <div class="kpi"><div class="k">Margin: bid vs actual</div><div class="v"><span class="faint" style="font-size:22px">${pct(j.estGM)} →</span> <span style="color:var(--${tone})">${pct(j.actGM)}</span></div><div class="s">${money(gp)} gross profit</div></div>
      <div class="kpi"><div class="k">Status</div><div class="v" style="font-size:24px">${a.closed?"Closed":"Open"}</div><div class="s">${a.closed?"Closed "+esc(a.closedAt):pct(j.pct,0)+" complete"}</div></div></div>
    <div class="cols"><div class="stack">
      <div class="card"><div class="card-h"><h3>Estimate vs actual</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th></th><th class="r">Estimated</th><th class="r">Actual</th><th class="r">Variance</th><th class="r"></th></tr></thead><tbody>${rows}</tbody></table></div></div>
      <div class="card"><div class="card-h"><h3>Labor by section</h3><span class="faint small">Adjusted estimate hours vs hours logged</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Section</th><th class="r">Estimated</th><th class="r">Actual</th><th class="r"></th></tr></thead><tbody>${secRows||`<tr><td colspan="4" class="empty">Log hours by section on Job costs.</td></tr>`}</tbody></table></div></div></div>
    <div class="stack"><div class="card"><div class="card-h"><h3>What to change next bid</h3></div><div class="card-b warn-list">
      ${lessons.length?lessons.map(l=>`<div class="w info">${ic("info")}<div><span style="color:var(--ink)">${esc(l)}</span></div></div>`).join(""):`<div class="w ok">${ic("check")}<div><b>${j.act.cost>0?"Landed close to the estimate":"No actuals yet"}</b><span>${j.act.cost>0?"Nothing ran more than 5% off.":"Enter costs and hours on Job costs."}</span></div></div>`}
      <p class="small muted" style="margin:6px 0 0">These are flags, not changes. Your labor units and prices only change when you edit them.</p></div></div>
      <div class="card"><div class="card-h"><h3>Closeout notes</h3></div><div class="card-b"><textarea class="inp" rows="4" placeholder="What went right, what bit you, what to remember at this address" data-ja="notes" ${a.closed?"disabled":""}>${esc(a.notes||"")}</textarea></div></div>
      <div class="card"><div class="card-b stack">${a.closed?`<button class="btn" data-a="reopenJob">Reopen job</button>`:`<button class="btn pri" data-a="closeJob">${ic("check")}Close job</button><span class="small muted">Closing locks the actuals and counts this job in the business numbers.</span>`}</div></div></div></div></div>`;
}

/* ---------------- BUSINESS ---------------- */
function bizFilters(){ return S.ui.biz||(S.ui.biz={year:"all",q:"all",type:"",cust:"",est:""}); }
function viewBusiness(){
  const f=bizFilters();
  const all=[...S.estimates.values()].filter(e=>!e.sample||e.ex);
  const years=[...new Set(all.map(e=>(e.job.date||e.created||"").slice(0,4)).filter(Boolean))].sort().reverse();
  const custs=[...new Set(all.map(e=>e.job.customer).filter(Boolean))].sort(), ests=[...new Set(all.map(e=>e.job.estimator).filter(Boolean))].sort();
  const inF=e=>{ const d=e.job.date||e.created||""; if(f.year!=="all"&&d.slice(0,4)!==f.year) return false; if(f.q!=="all"&&Math.ceil(+d.slice(5,7)/3)!==+f.q) return false;
    if(f.type&&!(e.job.types||[]).includes(f.type)) return false; if(f.cust&&e.job.customer!==f.cust) return false; if(f.est&&e.job.estimator!==f.est) return false; return true; };
  const L=all.filter(inF), bids=L.filter(e=>e.status!=="draft"), won=L.filter(e=>e.status==="won"), lost=L.filter(e=>e.status==="lost");
  const J=new Map(won.map(e=>[e.id,jobCalc(e)])), C=new Map(bids.map(e=>[e.id,calc(e,S)]));
  const sum=(a,fn)=>a.reduce((s,x)=>s+fn(x),0);
  const bidV=sum(bids,e=>C.get(e.id).price), wonV=sum(won,e=>J.get(e.id).contract);
  const winRate=(won.length+lost.length)?won.length/(won.length+lost.length):null;
  const closed=won.filter(e=>J.get(e.id).closed), active=won.filter(e=>!J.get(e.id).closed);
  const backlog=sum(active,e=>{ const j=J.get(e.id); return j.contract*(1-j.pct); });
  const wGM=(arr,fn)=>{ const rev=sum(arr,e=>J.get(e.id).contract); return rev>0?sum(arr,e=>J.get(e.id).contract*fn(J.get(e.id)))/rev:null; };
  const estGM=wGM(closed,j=>j.estGM), actGM=wGM(closed,j=>j.actGM), estGMall=wGM(won,j=>j.estGM);
  const bHrs=sum(closed,e=>J.get(e.id).bud.hrs), aHrs=sum(closed,e=>J.get(e.id).act.hrs), bMat=sum(closed,e=>J.get(e.id).bud.mat), aMat=sum(closed,e=>J.get(e.id).act.mat);
  const coRev=sum(won,e=>J.get(e.id).coPrice), coCost=sum(won,e=>J.get(e.id).coCost);
  const group=(keyFn)=>{ const m=new Map(); for(const e of won){ for(const k of [].concat(keyFn(e)||"—")){ const g=m.get(k)||{k,jobs:0,rev:0,est:0,act:0,closedRev:0,estC:0}; const j=J.get(e.id); g.jobs++; g.rev+=j.contract; g.est+=j.contract*j.estGM; if(j.closed){ g.closedRev+=j.contract; g.act+=j.contract*j.actGM; g.estC+=j.contract*j.estGM; } m.set(k,g); } }
    return [...m.values()].sort((a,b)=>b.rev-a.rev); };
  const gTable=(title,rows)=>`<div class="card"><div class="card-h"><h3>${title}</h3></div>${rows.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th></th><th class="r">Jobs</th><th class="r">Revenue</th><th class="r">Bid margin</th><th class="r">Actual margin</th><th>Bid → actual</th></tr></thead><tbody>${rows.map(g=>{ const eg=g.rev?g.est/g.rev:0, ag=g.closedRev?g.act/g.closedRev:null, egc=g.closedRev?g.estC/g.closedRev:null;
      return `<tr><td class="nm">${esc(g.k)}</td><td class="num r">${g.jobs}</td><td class="num r">${money(g.rev)}</td><td class="num r">${pct(eg)}</td><td class="num r">${ag==null?'<span class="faint">open</span>':pct(ag)}</td><td>${ag==null?"":gmBar(egc,ag)}</td></tr>`; }).join("")}</tbody></table></div>`:`<div class="empty">No awarded jobs in this view.</div>`}</div>`;
  const jobRows=won.slice().sort((a,b)=>(b.awardedAt||"").localeCompare(a.awardedAt||"")).map(e=>{ const j=J.get(e.id);
    return `<tr class="click" data-a="openJob" data-id="${e.id}"><td><div class="nm">${esc(e.job.project||e.num)}</div><div class="sub">${esc(e.job.customer||"")}${e.ex?' <span class="tag cu">Example</span>':""}</div></td><td>${j.closed?'<span class="pill won">Closed</span>':`<span class="pill submitted">${pct(j.pct,0)} done</span>`}</td>
      <td class="num r">${money(j.contract)}</td><td class="num r">${hrs(j.act.hrs)} / ${hrs(j.bud.hrs)}</td><td class="r">${j.closed?varTag(j.act.hrs,j.bud.hrs,true):varTag(j.act.hrs,j.bud.hrs*Math.max(j.pct,0.0001),true)}</td><td class="num r">${pct(j.estGM)}</td><td class="num r">${j.closed?pct(j.actGM):'<span class="faint">—</span>'}</td></tr>`; }).join("");
  const sel=(k,label,opts)=>`<div class="fld" style="min-width:140px"><label>${label}</label><select class="inp sm" data-c="biz" data-k="${k}">${opts}</select></div>`;
  const hasEx=all.some(e=>e.ex);
  const insight=[];
  if(closed.length&&bHrs>0){ const v=aHrs/bHrs-1; insight.push(Math.abs(v)<0.03?`Labor estimates are landing within ${pct(Math.abs(v))} on closed jobs.`:`Closed jobs used ${pct(Math.abs(v))} ${v>0?"more":"fewer"} labor hours than estimated. ${v>0?"That is the first place margin is leaking.":""}`); }
  if(estGM!=null&&actGM!=null&&estGM-actGM>0.02) insight.push(`Bids promised ${pct(estGM)} margin on closed jobs and delivered ${pct(actGM)}. The gap is ${money(sum(closed,e=>{const j=J.get(e.id);return j.contract*(j.estGM-j.actGM);}))} of profit.`);
  const typeG=group(e=>e.job.types&&e.job.types.length?e.job.types:["Untyped"]).filter(g=>g.closedRev>0);
  if(typeG.length>1){ const best=typeG.slice().sort((a,b)=>b.act/b.closedRev-a.act/a.closedRev); insight.push(`Most profitable work type so far: ${best[0].k} at ${pct(best[0].act/best[0].closedRev)} actual margin. Least: ${best[best.length-1].k} at ${pct(best[best.length-1].act/best[best.length-1].closedRev)}.`); }
  return `<div class="page">

    ${hasEx?`<div class="lockbar" style="background:var(--cu-soft)">${ic("info")}<span><b>Showing example jobs</b> so you can see how this fills in. They aren't saved and disappear when you remove them or reload.</span></div>`:""}
    <div class="card"><div class="card-b row" style="align-items:flex-end;gap:12px">
      ${sel("year","Year",opt("all","All years",f.year==="all")+years.map(y=>opt(y,y,f.year===y)).join(""))}
      ${sel("q","Quarter",opt("all","All",f.q==="all")+[1,2,3,4].map(q=>opt(q,"Q"+q,f.q==String(q))).join(""))}
      ${sel("type","Project type",opt("","All types",!f.type)+PROJECT_TYPES.map(t=>opt(t,t,f.type===t)).join(""))}
      ${sel("cust","Customer",opt("","All customers",!f.cust)+custs.map(t=>opt(t,t,f.cust===t)).join(""))}
      ${sel("est","Estimator",opt("","All estimators",!f.est)+ests.map(t=>opt(t,t,f.est===t)).join(""))}</div></div>

/* bid margin → actual margin: one track, one scale (0–40%), labeled numbers carry the meaning */
function gmBar(est,act){
  const X=v=>Math.max(0,Math.min(100,v/0.4*100));
  const worse=act<est-0.005;
  return `<div class="gmbar" title="Bid ${pct(est)} → actual ${pct(act)}"><span class="trk"></span><span class="seg ${worse?"down":"up"}" style="left:${Math.min(X(est),X(act))}%;width:${Math.abs(X(act)-X(est))}%"></span><i class="dot est" style="left:${X(est)}%"></i><i class="dot act ${worse?"down":"up"}" style="left:${X(act)}%"></i></div>`;
}

const IMPORT_FIELDS=[["name","Item name",["item name","item","name","product","product name","short description"]],["desc","Description",["description","item description","long description","desc"]],["cat","Category",["category","cat","class","product category","group"]],
  ["mfr","Manufacturer",["manufacturer","mfr","mfg","brand","vendor name"]],["mpn","Mfr part #",["mfr part","mfg part","manufacturer part number","mpn","catalog number","cat #","catalog #","part number","part #"]],
  ["supplier","Supplier",["supplier","distributor","vendor"]],["sku","Supplier SKU",["sku","vendor item","supplier sku","item #","item number","vendor part"]],["unit","Unit",["unit","uom","unit of measure"]],["pkg","Package qty",["package qty","pkg qty","pack","std pack","package"]],
  ["cost","Cost per unit (each)",["material each","cost each","unit cost","each","net each"]],["list","List price (per EA/C/M)",["material list","list","price","cost","net price","your price"]],["per","Price per (EA / C / M)",["material per","per","price per","uom price"]],
  ["date","Price date",["material updated","price date","date","updated","last updated"]],["lab1","Labor hrs (Average, each)",["average ea","labor average ea","labor avg","labor each","labor"]],["lab0","Labor Easy (each)",["easy ea"]],["lab2","Labor Difficult (each)",["difficult ea"]],["lab3","Labor Remodel (each)",["remodel ea"]],["lab4","Labor Old Work (each)",["old work ea"]]];
function guessMap(headers){
  const map={}, used=new Set(); const H=headers.map(h=>String(h).toLowerCase().trim());
  for(const [k,,syn] of IMPORT_FIELDS){ let best=-1;
    for(const s of syn){ const i=H.findIndex((h,j)=>!used.has(j)&&h===s); if(i>=0){best=i;break;} }
    if(best<0) for(const s of syn){ const i=H.findIndex((h,j)=>!used.has(j)&&h.includes(s)); if(i>=0){best=i;break;} }
    if(best>=0){ map[k]=best; used.add(best); } }
  return map;
}
async function loadScript(src,test){ if(test()) return; await new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("Could not load "+src)); document.head.appendChild(s); }); }
async function readImportFile(file){
  try{
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",()=>window.XLSX);
    const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:"array",cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
    let hi=rows.findIndex(r=>r.filter(x=>String(x).trim()).length>=2); if(hi<0) throw new Error("No header row found");
    const headers=rows[hi].map(h=>String(h).trim()), data=rows.slice(hi+1).filter(r=>r.some(x=>String(x).trim()));
    const sig=headers.join("|").toLowerCase(); let prof=Object.entries(S.profiles).find(([,p])=>p.sig===sig);
    S.ui.modal={type:"import",data:{file:file.name,headers,rows:data,map:prof?Object.assign({},prof[1].map):guessMap(headers),profile:prof?prof[0]:"",step:"map",supplier:prof?prof[1].supplier||"":""}};
    render(); if(prof) toast(`Recognized the "${prof[0]}" format`);
  }catch(err){ toast("Couldn't read that file: "+err.message); }
}
function rowVal(d,r,k){ const i=d.map[k]; if(i==null||i==="") return ""; const v=r[i]; return v instanceof Date?v.toISOString().slice(0,10):String(v==null?"":v).trim(); }
function normKey(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function tokens(s){ return new Set(String(s||"").toLowerCase().replace(/[^a-z0-9./ ]/g," ").split(/\s+/).filter(t=>t.length>0)); }
function jacc(a,b){ let i=0; for(const x of a) if(b.has(x)) i++; return i/((a.size+b.size-i)||1); }
function recFromRow(d,r){
  const perRaw=rowVal(d,r,"per").toUpperCase(); const per=perRaw.startsWith("M")?1000:perRaw.startsWith("C")?100:1;
  let cost=rowVal(d,r,"cost")!==""?n(rowVal(d,r,"cost")):rowVal(d,r,"list")!==""?n(rowVal(d,r,"list"))/per:null;
  const avg=rowVal(d,r,"lab1"); const lab=avg!==""?LAB_RATIO.map((x,i)=>{ const v=rowVal(d,r,"lab"+i); return v!==""?n(v):+(n(avg)*x).toFixed(4); }):null;
  let date=rowVal(d,r,"date"); if(/^\d{5}$/.test(date)){ const dt=new Date(Date.UTC(1899,11,30)+n(date)*864e5); date=dt.toISOString().slice(0,10); } else if(date&&!/^\d{4}-\d{2}-\d{2}/.test(date)){ const dt=new Date(date); date=isNaN(dt)?"":dt.toISOString().slice(0,10); } else date=date.slice(0,10);
  let unit=rowVal(d,r,"unit").toLowerCase(); if(unit==="each"||unit==="e") unit="ea"; if(unit==="feet"||unit==="foot"||unit==="lf") unit="ft";
  let cat=rowVal(d,r,"cat").replace(/^\d+\.\s*/,"");
  return {name:rowVal(d,r,"name")||rowVal(d,r,"desc"),desc:rowVal(d,r,"desc"),cat,mfr:rowVal(d,r,"mfr"),mpn:rowVal(d,r,"mpn"),supplier:rowVal(d,r,"supplier")||d.supplier||"",sku:rowVal(d,r,"sku"),unit,pkg:n(rowVal(d,r,"pkg"))||0,cost,date:date||today(),lab};
}
function classifyImport(d){
  const mats=[...S.mats.values()];
  const idx={mm:new Map(),ss:new Map(),mpn:new Map(),nm:new Map()}; const tk=new Map();
  for(const m of mats){ if(m.mfr&&m.mpn) idx.mm.set(normKey(m.mfr)+"|"+normKey(m.mpn),m); if(m.mpn) idx.mpn.set(normKey(m.mpn),m);
    if(m.supplier&&m.sku) idx.ss.set(normKey(m.supplier)+"|"+normKey(m.sku),m); for(const s of m.suppliers||[]) if(s.name&&s.sku) idx.ss.set(normKey(s.name)+"|"+normKey(s.sku),m);
    idx.nm.set(normKey(m.name)+"|"+m.unit,m); idx.nm.set(normKey(m.name)+"|",m); if(m.desc) idx.nm.set(normKey(m.desc)+"|"+m.unit,m); tk.set(m.id,tokens(m.name+" "+m.desc)); }
  const seen=new Set();
  d.recs=d.rows.map((r,i)=>{ const x=recFromRow(d,r); let m=null,how="";
    if(!x.name) return {i,x,cls:"skip",act:"skip",why:"No name"};
    if(x.mfr&&x.mpn&&(m=idx.mm.get(normKey(x.mfr)+"|"+normKey(x.mpn)))) how="Mfr + part #";
    else if(x.supplier&&x.sku&&(m=idx.ss.get(normKey(x.supplier)+"|"+normKey(x.sku)))) how="Supplier + SKU";
    else if(x.mpn&&(m=idx.mpn.get(normKey(x.mpn)))) how="Part #";
    else if((m=idx.nm.get(normKey(x.name)+"|"+(x.unit||""))||(!x.unit&&idx.nm.get(normKey(x.name)+"|"))||(x.desc&&idx.nm.get(normKey(x.desc)+"|"+(x.unit||""))))) how="Exact name";
    const key=normKey(x.mfr+x.mpn+x.sku)||normKey(x.name); if(seen.has(key)) return {i,x,cls:"dup",act:"skip",why:"Repeats an earlier row in this file"}; seen.add(key);
    if(m){ if(x.unit&&x.unit!==m.unit) return {i,x,m,cls:"conflict",act:"skip",why:`${how} match, but unit ${x.unit} vs ${m.unit}`};
      if(x.cost!=null&&x.cost>0&&Math.abs(x.cost-m.cost)>Math.max(0.005,m.cost*0.002)) return {i,x,m,cls:"price",act:"update",why:`${how}: ${money2(m.cost)} → ${money2(x.cost)}`};
      return {i,x,m,cls:"match",act:"skip",why:`${how}, no change`}; }
    const t=tokens(x.name+" "+x.desc); let best=null,bs=0;
    for(const mm of mats){ if(x.cat&&mm.cat&&normKey(x.cat)!==normKey(mm.cat)) continue; const s=jacc(t,tk.get(mm.id)); if(s>bs){bs=s;best=mm;} }
    if(best&&bs>=0.6) return {i,x,m:best,cls:"dup",act:"skip",why:`Looks like “${best.name}” (${Math.round(bs*100)}% similar)`};
    return {i,x,cls:"new",act:"add",why:"No match"}; });
  const P={conflict:0,dup:1,price:2,new:3,match:4,skip:5}; d.recs.sort((a,b)=>P[a.cls]-P[b.cls]||a.i-b.i);
}
