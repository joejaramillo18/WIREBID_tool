function commitImport(){
  const d=S.ui.modal.data; let a=0,u=0;
  for(const r of d.recs){ const x=r.x;
    if(r.act==="add"){ const id="I"+Date.now().toString(36).toUpperCase()+r.i;
      const m=Object.assign(catalogToMat([id,x.cat||"Imported",x.name,x.desc,x.unit||"ea",x.cost||0,x.date,x.lab||[0,0,0,0,0],"EA","EA"]),{custom:true,mfr:x.mfr,mpn:x.mpn,supplier:x.supplier,sku:x.sku,pkg:x.pkg||1});
      if(x.supplier) { m.suppliers=[{name:x.supplier,sku:x.sku,cost:m.cost,date:m.date}]; m.pref=x.supplier; }
      S.mats.set(id,m); save("mat",id); a++; }
    else if(r.act==="update"&&r.m){ const m=r.m;
      if(x.cost!=null&&x.cost>0&&x.cost!==m.cost){ (m.hist=m.hist||[]).push({cost:m.cost,date:m.date}); m.cost=x.cost; m.date=x.date; }
      for(const k of ["mfr","mpn","desc"]) if(!m[k]&&x[k]) m[k]=x[k];
      if(x.supplier){ m.suppliers=m.suppliers||[]; const s=m.suppliers.find(s=>normKey(s.name)===normKey(x.supplier)); if(s) Object.assign(s,{sku:x.sku||s.sku,cost:x.cost||s.cost,date:x.date}); else m.suppliers.push({name:x.supplier,sku:x.sku,cost:x.cost||m.cost,date:x.date}); if(!m.pref){ m.pref=x.supplier; m.supplier=x.supplier; m.sku=x.sku; } }
      if(x.lab&&x.lab.some(v=>v>0)) m.lab=x.lab;
      if(!m.custom) m.dirty=true; save("mat",m.id); u++; } }
  S.ui.modal=null; render(); toast(`Imported: ${a} added, ${u} updated`);
}

/* import format: Category, Assembly, Item, Qty [, Unit ("ft"/"ea")] [, Per run (Y)] — same as the Zoho assembly export */
async function importAssemblies(file){
  try{
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",()=>window.XLSX);
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array"}); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
    const H=rows[0].map(h=>String(h).toLowerCase().trim()); const col=(...k)=>H.findIndex(h=>k.some(x=>h===x||h.includes(x)));
    const ci=col("category","group"), ai=col("assembly"), ii=col("item","material","component"), qi=col("qty","quantity"), ui=col("unit","priced per"), ri=col("per run");
    if(ai<0||ii<0||qi<0) throw new Error("Need Assembly, Item, and Qty columns");
    const byName=new Map(); for(const m of S.mats.values()) byName.set(normKey(m.name),m.id);
    const G=new Map(), miss=new Set();
    for(const r of rows.slice(1)){ const an=String(r[ai]).trim(), it=String(r[ii]).trim(); if(!an||!it) continue;
      const g=G.get(an)||{name:an,grp:ci>=0?String(r[ci]).trim():"",unit:"",comps:[]}; const id=byName.get(normKey(it));
      if(ui>=0&&String(r[ui]).trim()) g.unit=/^f/i.test(String(r[ui]).trim())?"ft":"ea";
      if(id) g.comps.push([id,n(r[qi]),ri>=0&&/^y|^1|true/i.test(String(r[ri]))?1:0]); else miss.add(it); G.set(an,g); }
    let add=0,up=0; const existing=new Map([...S.asms.values()].filter(a=>!a.deleted).map(a=>[normKey(a.name),a]));
    for(const g of G.values()){ const unit=g.unit||((g.grp==="Feeder"||/per\s*'|per ft/i.test(g.name))?"ft":"ea"); const sec={"Feeder":"Feeders","Receptacle":"Devices","Switch":"Lighting","Lighting":"Lighting","Exterior":"Devices","Service":"Service","Branch":"Branch Circuits","Motor":"Equipment","Data":"Specialty Systems","Residential":"Devices"}[g.grp]||"Misc";
      const ex=existing.get(normKey(g.name));
      if(ex){ ex.comps=g.comps; ex.grp=g.grp||ex.grp; ex.unit=g.unit||ex.unit; ex.dirty=true; save("asm",ex.id); up++; }
      else { const a={id:"A"+Date.now().toString(36).toUpperCase()+add,name:g.name,grp:g.grp,sec,unit,fav:false,note:"",comps:g.comps,extraHrs:0,builtin:false}; S.asms.set(a.id,a); save("asm",a.id); add++; } }
    render(); toast(`Assemblies: ${add} added, ${up} updated${miss.size?`. ${miss.size} part name${miss.size>1?"s":""} not in Materials: `+[...miss].slice(0,3).join(", ")+(miss.size>3?"…":""):""}`);
  }catch(err){ toast("Couldn't import: "+err.message); }
}

function toCSV(rows){ return rows.map(r=>r.map(v=>{ const s=String(v==null?"":v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(",")).join("\n"); }

async function saveFile(name,data){
  try{ const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(!dl){ /* standalone: normal browser download */
      const blob=data instanceof Blob?data:new Blob([data],{type:"application/octet-stream"}); const url=URL.createObjectURL(blob);
      const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast("Downloaded "+name); return; }
    await dl.save({filename:name,data}); toast("Saved "+name);
  }catch(err){ if(err&&err.code==="declined") return; toast("Couldn't save: "+(err&&err.message||err)); }
}
async function restoreBackup(file){
  try{ const d=JSON.parse(await file.text()); if(!d||d.v!==1) throw new Error("Not a Wirebid backup");
    if(d.settings){ S.settings=Object.assign(defaultSettings(),d.settings); save("settings"); }
    S.profiles=d.profiles||{}; save("profiles");
    for(const m of Object.values(d.materials||{})){ S.mats.set(m.id,Object.assign({},m,{dirty:!m.custom})); save("mat",m.id); }
    for(const a of Object.values(d.assemblies||{})){ S.asms.set(a.id,Object.assign({},a,{dirty:!!a.builtin})); save("asm",a.id); }
    for(const e of Object.values(d.estimates||{})){ S.estimates.set(e.id,e); save("est",e.id); }
    render(); toast("Backup restored");
  }catch(err){ toast("Restore failed: "+err.message); }
}

  if(W.length) doc.autoTable({startY:y,margin:{left:M,right:M},head:[["Review flags"]],body:W.map(w=>[`${w[0]==="bad"?"CRITICAL":w[0]==="warn"?"WARN":"NOTE"}  ${w[1]}. ${w[2]}`]),theme:"plain",headStyles:{textColor:CU,fontSize:8},styles:{fontSize:7.5,cellPadding:2}});
  const pc=doc.getNumberOfPages(); for(let i=1;i<=pc;i++){ doc.setPage(i); doc.setFontSize(7); doc.setTextColor(...GREY); doc.text(`Internal · ${S.settings.company} · generated ${today()}`,M,772); doc.text(`Page ${i} of ${pc}`,PW-M,772,{align:"right"}); }
  saveFile(`${fileBase(e)} bid sheet.pdf`,doc.output("blob"));
}

(async function boot(){

  await load(); render();
  window.addEventListener("beforeunload",()=>{ if(pending.size) flush(); });
})();
